<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inter de Litrão — Ficha Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#15130F; --preto-2:#201C15; --ouro:#F2AE1E; --ouro-claro:#FFD65A;
    --osso:#F7F1E1; --osso-2:#EFE6CE; --vermelho:#D93B3B; --verde:#4C9A5B; --cinza:#8B8578;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--preto); color:var(--osso); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  .display{font-family:'Anton', sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .mono{font-family:'Space Mono', monospace;}
  a{color:inherit;}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px 50px;}

  header.top{
    position:sticky; top:0; z-index:50;
    background:rgba(21,19,15,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(242,174,30,.25);
  }
  .top-inner{display:flex; align-items:center; gap:10px; padding:12px 18px; max-width:560px; margin:0 auto;}
  .top-inner a.back{font-size:13px; text-decoration:none; color:var(--osso); opacity:.85; display:flex; align-items:center; gap:6px;}
  .top-inner span.brand{margin-left:auto; font-size:13px; letter-spacing:1px; color:var(--ouro-claro);}

  .summary-card{
    margin:22px 0; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .summary-eyebrow{background:var(--ouro); color:var(--preto); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:8px 18px;}
  .summary-body{background:var(--osso); color:var(--preto); padding:20px;}
  .summary-body .date{font-size:12.5px; color:#5c5646; margin-bottom:6px;}
  .summary-body .matchup{display:flex; align-items:center; justify-content:center; gap:16px; margin:10px 0;}
  .summary-body .team{flex:1; text-align:center; font-weight:700; font-size:15px; line-height:1.3;}
  .summary-body .score{font-family:'Anton'; font-size:36px; white-space:nowrap;}
  .result-tag{display:inline-block; margin-top:6px; font-size:11px; font-weight:800; border-radius:6px; padding:4px 10px;}
  .tag-v{background:var(--verde); color:#fff;}
  .tag-d{background:var(--vermelho); color:#fff;}
  .tag-e{background:var(--cinza); color:#fff;}
  .summary-footer{text-align:center; margin-top:10px;}
  .summary-body .venue{text-align:center; font-size:12px; color:#5c5646; margin-top:10px;}

  .sec-head{margin:28px 0 14px;}
  .sec-head .tag{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ouro); font-weight:700;}
  .sec-head h2{font-size:22px; margin:2px 0 0;}

  .group-label{
    font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cinza);
    margin:18px 0 8px; display:flex; align-items:center; gap:8px;
  }
  .group-label::after{content:''; flex:1; height:1px; background:rgba(247,241,225,.15);}

  .player-row{
    display:flex; align-items:center; gap:12px; background:var(--osso); color:var(--preto);
    border-radius:12px; padding:11px 14px; margin-bottom:8px; box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  .player-row .num{
    font-family:'Anton'; font-size:16px; background:var(--preto); color:var(--ouro-claro);
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-row .info{flex:1; min-width:0;}
  .player-row .name{font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .player-row .pos{font-size:11px; color:#5c5646;}
  .player-row .badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:3px;}
  .badge-chip{font-size:11px; font-weight:700; background:var(--osso-2); border-radius:6px; padding:2px 7px; white-space:nowrap;}
  .badge-mvp{background:var(--ouro); color:var(--preto);}

  .loading, .empty-msg{text-align:center; color:var(--cinza); font-size:13.5px; padding:30px 10px;}
  .error-msg{text-align:center; color:var(--vermelho); font-size:13.5px; padding:30px 10px;}

  footer{text-align:center; padding:30px 0 20px; color:var(--cinza); font-size:12px;}

  /* ---------- NAVEGAÇÃO ENTRE JOGOS ---------- */
  .match-nav{display:flex; gap:10px; margin-top:26px;}
  .nav-btn{
    flex:1; display:flex; flex-direction:column; text-decoration:none; color:var(--osso);
    background:var(--preto-2); border:1px solid rgba(242,174,30,.3); border-radius:12px;
    padding:12px 14px; font-size:12.5px;
  }
  .nav-btn.next{text-align:right;}
  .nav-btn .nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--cinza); margin-bottom:3px;}
  .nav-btn .nav-opp{font-weight:700; font-size:13.5px;}
  .nav-btn.disabled{opacity:.3; pointer-events:none;}

  /* ---------- CRAQUE DA PARTIDA (login + votação) ---------- */
  .vote-card{background:var(--osso); color:var(--preto); border-radius:16px; padding:18px; margin:22px 0; box-shadow:0 10px 24px rgba(0,0,0,.3);}
  .vote-card .vote-title{font-weight:800; font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .vote-card .vote-sub{font-size:12px; color:#5c5646; margin-bottom:14px;}
  .vote-card label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#5c5646; margin:10px 0 4px;}
  .vote-card label:first-of-type{margin-top:0;}
  .vote-card input[type=text], .vote-card input[type=email], .vote-card input[type=password], .vote-card select{
    width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid #ddd2ae; font-family:'Work Sans'; font-size:14px; background:#fff; color:var(--preto);
  }
  .vote-card input:focus, .vote-card select:focus{outline:2px solid var(--ouro); border-color:var(--ouro);}
  .vote-toggle{font-size:12.5px; color:var(--ouro); text-decoration:underline; cursor:pointer; margin-top:10px; display:inline-block;}
  .vote-candidate{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid #eee2c0; border-radius:10px;
    padding:9px 12px; margin-bottom:7px; cursor:pointer;
  }
  .vote-candidate.selected{border-color:var(--ouro); background:#fff8e6;}
  .vote-candidate input{width:auto; margin:0;}
  .vote-candidate .vc-name{font-size:13.5px; font-weight:600; flex:1;}
  .vote-bar-row{margin-bottom:8px;}
  .vote-bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;}
  .vote-bar-track{background:#eee2c0; border-radius:6px; height:8px; overflow:hidden;}
  .vote-bar-fill{background:var(--ouro); height:100%;}
  .vote-msg{font-size:12.5px; margin-top:8px;}
  .vote-msg.ok{color:var(--verde);}
  .vote-msg.err{color:var(--vermelho);}
  .vote-closed-tag{display:inline-block; background:var(--osso-2); color:#5c5646; font-size:11px; font-weight:700; border-radius:6px; padding:4px 9px; margin-bottom:10px;}

  /* ---------- MODAL DE CONTA (login/cadastro) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:var(--osso); color:var(--preto); border-radius:16px; padding:22px;
    max-width:360px; width:100%; max-height:85vh; overflow-y:auto; position:relative;
  }
  .modal-close{position:absolute; top:14px; right:16px; cursor:pointer; font-size:16px; color:#8B8578;}
  .modal-card label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#5c5646; margin:12px 0 4px;}
  .modal-card label:first-of-type{margin-top:0;}
  .modal-card input[type=email], .modal-card input[type=password], .modal-card select{
    width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid #ddd2ae; font-family:'Work Sans'; font-size:14px; background:#fff; color:var(--preto);
  }
  .modal-card input:focus, .modal-card select:focus{outline:2px solid var(--ouro); border-color:var(--ouro);}
  .modal-title{font-weight:800; font-size:16px; margin-bottom:4px; padding-right:20px;}
  .modal-sub{font-size:12px; color:#5c5646; margin-bottom:14px;}
  .modal-toggle{font-size:12.5px; color:var(--ouro); text-decoration:underline; cursor:pointer; margin-top:12px; display:inline-block;}
  .modal-msg{font-size:12.5px; margin-top:8px;}
  .modal-msg.ok{color:var(--verde);}
  .modal-msg.err{color:var(--vermelho);}
  .btn{display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; font-weight:700; font-size:13.5px; padding:10px 16px; border-radius:999px;}
  .btn-ouro{background:var(--ouro); color:var(--preto);}
  .btn-outline{background:transparent; border:1.5px solid #ddd2ae; color:var(--preto);}
  .row-actions{display:flex; gap:8px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="back" href="index.html#resultados">← Voltar</a>
    <span class="brand display">Inter de Litrão</span>
    <a href="#" id="accountLink" onclick="openAccountModal(); return false;" style="margin-left:12px; font-size:13px; color:var(--ouro-claro); text-decoration:none; font-weight:700;">Entrar</a>
  </div>
</header>

<div id="accountModal" class="modal-overlay">
  <div class="modal-card">
    <span class="modal-close" onclick="closeAccountModal()">✕</span>
    <div id="accountModalBody"></div>
  </div>
</div>

<div class="wrap">
  <div id="summaryArea"><p class="loading">Carregando ficha técnica...</p></div>

  <div id="voteArea"></div>

  <div id="lineupArea"></div>

  <div id="matchNav"></div>
</div>

<footer>🟡⚫ Jogar como bebemos ⚫🟡</footer>

<script>
const SUPABASE_URL = 'https://crrjrzetvkvnjvlrvtdp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bFGO4xUX3YYu4RZGJjgDAg_FHZaReYe';

function headers(){
  return { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
}

function resultTagHtml(home, away){
  if(home === null || away === null) return '';
  if(home > away) return '<span class="result-tag tag-v">Vitória</span>';
  if(home < away) return '<span class="result-tag tag-d">Derrota</span>';
  return '<span class="result-tag tag-e">Empate</span>';
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${dt.getDate()} de ${meses[dt.getMonth()]} de ${dt.getFullYear()} (${dias[dt.getDay()]})`;
}

function playerRowHtml(p){
  const badges = [];
  if(p.gols > 0) badges.push(`<span class="badge-chip">⚽ ${p.gols}</span>`);
  if(p.assistencias > 0) badges.push(`<span class="badge-chip">🅰️ ${p.assistencias}</span>`);
  if(p.amarelo > 0) badges.push(`<span class="badge-chip">🟨 ${p.amarelo}</span>`);
  if(p.vermelho > 0) badges.push(`<span class="badge-chip">🟥 ${p.vermelho}</span>`);
  return `<div class="player-row">
    <div class="num">${p.shirt_number ?? '-'}</div>
    <div class="info">
      <div class="name">${p.player_name} ${p.mvp ? '<span class="badge-chip badge-mvp">★ MVP</span>' : ''}</div>
      <div class="pos">${p.position || ''}</div>
      ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
    </div>
  </div>`;
}

function navBtnHtml(match, direction){
  if(!match){
    return `<div class="nav-btn ${direction} disabled">
      <span class="nav-label">${direction === 'prev' ? '← Anterior' : 'Próximo →'}</span>
      <span class="nav-opp">—</span>
    </div>`;
  }
  const dt = new Date(match.date + 'T12:00:00');
  const dateLabel = dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  return `<a class="nav-btn ${direction}" href="partida.html?id=${match.id}">
    <span class="nav-label">${direction === 'prev' ? '← Jogo anterior' : 'Próximo jogo →'}</span>
    <span class="nav-opp">${dateLabel} · ${match.opponent || 'Adversário'}</span>
  </a>`;
}

/* ---------- CRAQUE DA PARTIDA: login de jogador + votação ---------- */
let playerToken = null;
try{ playerToken = sessionStorage.getItem('ilb_player_token'); }catch(e){}
let playerUser = null;   // {id, email}
let playerRoster = null; // linha do roster vinculada a esse usuário

function playerHeaders(){
  return {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${playerToken || SUPABASE_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function fetchPlayerSession(){
  if(!playerToken) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: playerHeaders() });
    if(!res.ok){ playerToken = null; try{ sessionStorage.removeItem('ilb_player_token'); }catch(e){} return; }
    playerUser = await res.json();
    const rosterRes = await fetch(`${SUPABASE_URL}/rest/v1/roster?user_id=eq.${playerUser.id}&select=*`, { headers: playerHeaders() });
    const rosterRows = await rosterRes.json();
    playerRoster = rosterRows[0] || null;
  }catch(e){ /* segue sem sessão */ }
}

/* ---------- MODAL DE CONTA (mesmo login usado na votação) ---------- */
function renderAccountLink(){
  const link = document.getElementById('accountLink');
  if(!link) return;
  link.textContent = (playerToken && playerUser) ? (playerRoster ? playerRoster.name.split(' ')[0] : 'Minha conta') : 'Entrar';
}

function openAccountModal(){
  document.getElementById('accountModal').classList.add('open');
  if(playerToken && playerUser) renderAccountModalLoggedIn();
  else renderLoginModalForm();
}
function closeAccountModal(){
  document.getElementById('accountModal').classList.remove('open');
}

function renderLoginModalForm(){
  document.getElementById('accountModalBody').innerHTML = `
    <div class="modal-title">Entrar</div>
    <div class="modal-sub">Use sua conta pra votar no craque das partidas.</div>
    <label>E-mail</label>
    <input type="email" id="modalLoginEmail" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="modalLoginPass" placeholder="••••••••">
    <div class="row-actions" style="margin-top:10px;"><button class="btn btn-ouro" onclick="modalLoginSubmit()">Entrar</button></div>
    <div id="modalMsg" class="modal-msg"></div>
    <span class="modal-toggle" onclick="renderSignupModalForm()">Ainda não tem conta? Cadastre-se</span>
  `;
}

function renderSignupModalForm(){
  document.getElementById('accountModalBody').innerHTML = `
    <div class="modal-title">Criar conta</div>
    <div class="modal-sub">Só o elenco consegue votar — depois de criar a conta, você vincula seu nome.</div>
    <label>Seu e-mail</label>
    <input type="email" id="modalSignupEmail" placeholder="seu@email.com">
    <label>Crie uma senha</label>
    <input type="password" id="modalSignupPass" placeholder="mínimo 6 caracteres">
    <div class="row-actions" style="margin-top:10px;"><button class="btn btn-ouro" onclick="modalSignupSubmit()">Criar conta</button></div>
    <div id="modalMsg" class="modal-msg"></div>
    <span class="modal-toggle" onclick="renderLoginModalForm()">Já tem conta? Fazer login</span>
  `;
}

async function renderAccountModalLoggedIn(){
  if(!playerRoster){
    let options = '<option value="">Carregando...</option>';
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/roster?user_id=is.null&select=id,name&order=name.asc`, { headers: playerHeaders() });
      const rows = await res.json();
      options = '<option value="">Selecione...</option>' + rows.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    }catch(e){}
    document.getElementById('accountModalBody').innerHTML = `
      <div class="modal-title">Falta vincular seu nome</div>
      <div class="modal-sub">Escolha quem você é no elenco pra liberar sua conta.</div>
      <label>Seu nome no elenco</label>
      <select id="modalClaimRosterId">${options}</select>
      <div class="row-actions" style="margin-top:10px;"><button class="btn btn-ouro" onclick="modalClaimSubmit()">Vincular</button></div>
      <div id="modalMsg" class="modal-msg"></div>
      <span class="modal-toggle" onclick="modalLogout()">Sair</span>
    `;
    return;
  }
  document.getElementById('accountModalBody').innerHTML = `
    <div class="modal-title">Olá, ${playerRoster.name}! 👋</div>
    <div class="modal-sub">${playerUser.email}</div>
    <div class="modal-sub">Sua conta está pronta pra votar no craque de cada partida.</div>
    <div class="row-actions"><button class="btn btn-outline" onclick="modalLogout()">Sair da conta</button></div>
  `;
}

async function modalLoginSubmit(){
  const email = document.getElementById('modalLoginEmail').value.trim();
  const password = document.getElementById('modalLoginPass').value;
  const msgEl = document.getElementById('modalMsg');
  if(!email || !password){ msgEl.textContent = 'Preencha e-mail e senha.'; msgEl.className = 'modal-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token){ msgEl.textContent = 'E-mail ou senha incorretos.'; msgEl.className = 'modal-msg err'; return; }
    playerToken = data.access_token;
    try{ sessionStorage.setItem('ilb_player_token', playerToken); }catch(e){}
    location.reload();
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className = 'modal-msg err';
  }
}

async function modalSignupSubmit(){
  const email = document.getElementById('modalSignupEmail').value.trim();
  const password = document.getElementById('modalSignupPass').value;
  const msgEl = document.getElementById('modalMsg');
  if(!email || password.length < 6){ msgEl.textContent = 'Preencha e-mail e uma senha com pelo menos 6 caracteres.'; msgEl.className = 'modal-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.msg || data.error_description || 'Erro ao criar conta.'; msgEl.className = 'modal-msg err'; return; }
    if(data.access_token){
      playerToken = data.access_token;
      try{ sessionStorage.setItem('ilb_player_token', playerToken); }catch(e){}
      location.reload();
    } else {
      msgEl.textContent = 'Conta criada! Confirme seu e-mail e depois faça login.'; msgEl.className = 'modal-msg ok';
    }
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className = 'modal-msg err';
  }
}

async function modalClaimSubmit(){
  const rosterId = document.getElementById('modalClaimRosterId').value;
  const msgEl = document.getElementById('modalMsg');
  if(!rosterId){ msgEl.textContent = 'Selecione seu nome.'; msgEl.className = 'modal-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/claim_roster`, {
      method: 'POST',
      headers: { ...playerHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify({ target_roster_id: Number(rosterId) })
    });
    if(!res.ok){ msgEl.textContent = 'Erro ao vincular. Esse nome pode já estar em uso.'; msgEl.className = 'modal-msg err'; return; }
    location.reload();
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className = 'modal-msg err';
  }
}

function modalLogout(){
  playerToken = null; playerUser = null; playerRoster = null;
  try{ sessionStorage.removeItem('ilb_player_token'); }catch(e){}
  location.reload();
}

function votingWindowOpen(matchDate){
  const start = new Date(matchDate + 'T00:00:00');
  const cutoff = new Date(start.getTime() + 36*60*60*1000); // meio-dia do dia seguinte (36h após a meia-noite do jogo)
  return new Date() < cutoff;
}

async function renderVoteArea(match, lineup, matchId){
  const el = document.getElementById('voteArea');
  if(!lineup.length){ el.innerHTML = ''; return; }

  const open = votingWindowOpen(match.date);
  await fetchPlayerSession();
  renderAccountLink();

  const tallyRes = await fetch(`${SUPABASE_URL}/rest/v1/mvp_votes?match_id=eq.${matchId}&select=voted_for_lineup_entry_id`, { headers: playerHeaders() });
  const allVotes = await tallyRes.json();
  const counts = {};
  allVotes.forEach(v => { counts[v.voted_for_lineup_entry_id] = (counts[v.voted_for_lineup_entry_id]||0) + 1; });
  const totalVotes = allVotes.length;

  const tallyHtml = () => {
    if(totalVotes === 0) return '<p style="font-size:12.5px;color:#5c5646;">Ainda sem votos nesse jogo.</p>';
    return lineup
      .map(p => ({ p, n: counts[p.id] || 0 }))
      .sort((a,b) => b.n - a.n)
      .map(({p,n}) => {
        const pct = totalVotes ? Math.round((n/totalVotes)*100) : 0;
        return `<div class="vote-bar-row">
          <div class="vote-bar-label"><span>${p.player_name}</span><span>${n} voto${n===1?'':'s'} (${pct}%)</span></div>
          <div class="vote-bar-track"><div class="vote-bar-fill" style="width:${pct}%;"></div></div>
        </div>`;
      }).join('');
  };

  if(!open){
    el.innerHTML = `<div class="vote-card">
      <div class="vote-title">🏆 Craque da Partida</div>
      <span class="vote-closed-tag">Votação encerrada</span>
      ${tallyHtml()}
    </div>`;
    return;
  }

  // votação aberta
  if(!playerToken || !playerUser){
    el.innerHTML = `<div class="vote-card">
      <div class="vote-title">🏆 Craque da Partida</div>
      <div class="vote-sub">Votação aberta até o meio-dia do dia seguinte ao jogo. Só o elenco vota — faça login com sua conta.</div>
      <div id="authForms">${loginFormHtml()}</div>
    </div>`;
    return;
  }

  if(!playerRoster){
    el.innerHTML = `<div class="vote-card">
      <div class="vote-title">🏆 Craque da Partida</div>
      <div class="vote-sub">Sua conta ainda não está vinculada a um atleta do elenco. Escolha seu nome pra liberar o voto:</div>
      <div id="claimArea">${await claimFormHtml()}</div>
      <div id="voteMsg"></div>
    </div>`;
    return;
  }

  // pode votar — busca voto já existente
  const myVoteRes = await fetch(`${SUPABASE_URL}/rest/v1/mvp_votes?match_id=eq.${matchId}&voter_user_id=eq.${playerUser.id}&select=*`, { headers: playerHeaders() });
  const myVotes = await myVoteRes.json();
  const myVote = myVotes[0] || null;

  const candidatesHtml = lineup.map(p => `
    <label class="vote-candidate ${myVote && myVote.voted_for_lineup_entry_id === p.id ? 'selected' : ''}" onclick="document.querySelectorAll('.vote-candidate').forEach(el=>el.classList.remove('selected')); this.classList.add('selected');">
      <input type="radio" name="voteChoice" value="${p.id}" ${myVote && myVote.voted_for_lineup_entry_id === p.id ? 'checked' : ''}>
      <span class="vc-name">${p.shirt_number ? '#'+p.shirt_number+' · ' : ''}${p.player_name}</span>
    </label>`).join('');

  el.innerHTML = `<div class="vote-card">
    <div class="vote-title">🏆 Craque da Partida</div>
    <div class="vote-sub">Votando como <b>${playerRoster.name}</b> · aberto até meio-dia do dia seguinte ao jogo</div>
    ${candidatesHtml}
    <div class="row-actions" style="margin-top:10px;">
      <button class="btn btn-ouro btn-sm" onclick="submitVote(${matchId})">${myVote ? 'Atualizar voto' : 'Votar'}</button>
    </div>
    <div id="voteMsg"></div>
    <div class="group-label" style="margin-top:18px;">Resultado parcial</div>
    ${tallyHtml()}
  </div>`;
}

function loginFormHtml(){
  return `
    <label>E-mail</label>
    <input type="email" id="playerLoginEmail" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="playerLoginPass" placeholder="••••••••">
    <div class="row-actions" style="margin-top:10px;">
      <button class="btn btn-ouro btn-sm" onclick="playerLoginSubmit()">Entrar</button>
    </div>
    <div id="authMsg" class="vote-msg"></div>
    <span class="vote-toggle" onclick="showSignupForm()">Ainda não tem conta? Cadastre-se</span>
  `;
}

async function claimFormHtml(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/roster?user_id=is.null&select=id,name&order=name.asc`, { headers: playerHeaders() });
    const rows = await res.json();
    const options = rows.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    return `
      <label>Seu nome no elenco</label>
      <select id="claimRosterId"><option value="">Selecione...</option>${options}</select>
      <div class="row-actions" style="margin-top:10px;">
        <button class="btn btn-ouro btn-sm" onclick="claimRosterSubmit()">Vincular minha conta</button>
      </div>
    `;
  }catch(e){
    return '<p class="error-msg">Erro ao carregar o elenco.</p>';
  }
}

function showSignupForm(){
  document.getElementById('authForms').innerHTML = `
    <label>Seu e-mail</label>
    <input type="email" id="playerSignupEmail" placeholder="seu@email.com">
    <label>Crie uma senha</label>
    <input type="password" id="playerSignupPass" placeholder="mínimo 6 caracteres">
    <div class="row-actions" style="margin-top:10px;">
      <button class="btn btn-ouro btn-sm" onclick="playerSignupSubmit()">Criar conta</button>
    </div>
    <div id="authMsg" class="vote-msg"></div>
    <span class="vote-toggle" onclick="location.reload()">Já tem conta? Fazer login</span>
  `;
}

async function playerLoginSubmit(){
  const email = document.getElementById('playerLoginEmail').value.trim();
  const password = document.getElementById('playerLoginPass').value;
  const msgEl = document.getElementById('authMsg');
  if(!email || !password){ msgEl.textContent = 'Preencha e-mail e senha.'; msgEl.className='vote-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token){ msgEl.textContent = 'E-mail ou senha incorretos.'; msgEl.className='vote-msg err'; return; }
    playerToken = data.access_token;
    try{ sessionStorage.setItem('ilb_player_token', playerToken); }catch(e){}
    location.reload();
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className='vote-msg err';
  }
}

async function playerSignupSubmit(){
  const email = document.getElementById('playerSignupEmail').value.trim();
  const password = document.getElementById('playerSignupPass').value;
  const msgEl = document.getElementById('authMsg');
  if(!email || password.length < 6){ msgEl.textContent = 'Preencha e-mail e uma senha com pelo menos 6 caracteres.'; msgEl.className='vote-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.msg || data.error_description || 'Erro ao criar conta.'; msgEl.className='vote-msg err'; return; }
    if(data.access_token){
      playerToken = data.access_token;
      try{ sessionStorage.setItem('ilb_player_token', playerToken); }catch(e){}
      location.reload();
    } else {
      msgEl.textContent = 'Conta criada! Confirme seu e-mail (verifique a caixa de entrada) e depois faça login.';
      msgEl.className = 'vote-msg ok';
    }
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className='vote-msg err';
  }
}

async function claimRosterSubmit(){
  const rosterId = document.getElementById('claimRosterId').value;
  const msgEl = document.getElementById('voteMsg');
  if(!rosterId){ msgEl.textContent = 'Selecione seu nome.'; msgEl.className='vote-msg err'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/claim_roster`, {
      method: 'POST',
      headers: { ...playerHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify({ target_roster_id: Number(rosterId) })
    });
    if(!res.ok){ msgEl.textContent = 'Erro ao vincular. Talvez esse nome já tenha sido escolhido por outra pessoa.'; msgEl.className='vote-msg err'; return; }
    location.reload();
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className='vote-msg err';
  }
}

async function submitVote(matchId){
  const checked = document.querySelector('input[name="voteChoice"]:checked');
  const msgEl = document.getElementById('voteMsg');
  if(!checked){ msgEl.textContent = 'Escolha um jogador antes de votar.'; msgEl.className='vote-msg err'; return; }
  const votedFor = Number(checked.value);
  try{
    const existingRes = await fetch(`${SUPABASE_URL}/rest/v1/mvp_votes?match_id=eq.${matchId}&voter_user_id=eq.${playerUser.id}&select=id`, { headers: playerHeaders() });
    const existing = await existingRes.json();
    let res;
    if(existing.length){
      res = await fetch(`${SUPABASE_URL}/rest/v1/mvp_votes?id=eq.${existing[0].id}`, {
        method: 'PATCH',
        headers: { ...playerHeaders(), Prefer: 'return=representation' },
        body: JSON.stringify({ voted_for_lineup_entry_id: votedFor })
      });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/mvp_votes`, {
        method: 'POST',
        headers: { ...playerHeaders(), Prefer: 'return=representation' },
        body: JSON.stringify({ match_id: matchId, voter_user_id: playerUser.id, voted_for_lineup_entry_id: votedFor })
      });
    }
    if(!res.ok){ msgEl.textContent = 'Erro ao votar. A votação desse jogo pode já ter encerrado.'; msgEl.className='vote-msg err'; return; }
    msgEl.textContent = 'Voto registrado! 🎉'; msgEl.className='vote-msg ok';
    setTimeout(()=>location.reload(), 900);
  }catch(e){
    msgEl.textContent = 'Erro de conexão.'; msgEl.className='vote-msg err';
  }
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const summaryEl = document.getElementById('summaryArea');
  const lineupEl = document.getElementById('lineupArea');
  const navEl = document.getElementById('matchNav');

  fetchPlayerSession().then(renderAccountLink);

  if(!id){
    summaryEl.innerHTML = '<p class="error-msg">Jogo não encontrado — falta o identificador na URL.</p>';
    return;
  }

  try{
    const [matchRes, finishedRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${id}&select=*`, { headers: headers() }),
      fetch(`${SUPABASE_URL}/rest/v1/matches?home_score=not.is.null&select=id,date,opponent&order=date.asc`, { headers: headers() })
    ]);
    const matches = await matchRes.json();
    if(!matches.length){
      summaryEl.innerHTML = '<p class="error-msg">Esse jogo não foi encontrado.</p>';
      return;
    }
    const m = matches[0];

    summaryEl.innerHTML = `
      <div class="summary-card">
        <div class="summary-eyebrow">Ficha técnica</div>
        <div class="summary-body">
          <div class="date">${fmtDate(m.date)}</div>
          <div class="matchup">
            <div class="team">Inter de Litrão</div>
            <div class="score mono">${m.home_score ?? '–'} x ${m.away_score ?? '–'}</div>
            <div class="team">${m.opponent || 'Adversário'}</div>
          </div>
          <div class="summary-footer">${resultTagHtml(m.home_score, m.away_score)}</div>
          <div class="venue">A.A. Anhangüera · Rua dos Italianos, 1261 – Bom Retiro</div>
        </div>
      </div>
    `;

    // navegação entre jogos (só entre os que já têm placar/ficha)
    const finished = await finishedRes.json();
    const idx = finished.findIndex(x => String(x.id) === String(id));
    const prevMatch = idx > 0 ? finished[idx - 1] : null;
    const nextMatch = (idx >= 0 && idx < finished.length - 1) ? finished[idx + 1] : null;
    navEl.innerHTML = `<div class="match-nav">${navBtnHtml(prevMatch,'prev')}${navBtnHtml(nextMatch,'next')}</div>`;

    const lineupRes = await fetch(`${SUPABASE_URL}/rest/v1/lineup_entries?match_id=eq.${id}&select=*&order=shirt_number.asc`, { headers: headers() });
    const lineup = await lineupRes.json();

    await renderVoteArea(m, lineup, id);

    if(!lineup.length){
      lineupEl.innerHTML = '<p class="empty-msg">A escalação desse jogo ainda não foi registrada.</p>';
      return;
    }

    const isReserve = p => /reserva|sub/i.test(p.position || '');
    const titulares = lineup.filter(p => !isReserve(p));
    const reservas = lineup.filter(p => isReserve(p));


    let html = '';
    if(titulares.length){
      html += '<div class="group-label">Titulares</div>';
      html += titulares.map(playerRowHtml).join('');
    }
    if(reservas.length){
      html += '<div class="group-label">Banco / Reservas</div>';
      html += reservas.map(playerRowHtml).join('');
    }
    lineupEl.innerHTML = html;

  }catch(e){
    summaryEl.innerHTML = '<p class="error-msg">Não foi possível carregar a ficha técnica agora. Tente novamente em instantes.</p>';
  }
}

init();
</script>
</body>
</html>
